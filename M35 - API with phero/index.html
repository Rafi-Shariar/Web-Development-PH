<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M35 - API with PheroTube</title>

    <!-- Daisy Ui + Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      .active {
        background-color: red;
        color: white;
      }
    </style>
  </head>
  <body>
    <header class="w-10/12 mx-auto">
      <!-- navbar -->
      <nav class="flex justify-between mt-5">
        <img src="./Logo.png" alt="" />
        <div>
          <label class="input">
            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></g></svg>
            <input type="search" required placeholder="Search" id="SearchInput"/>
          </label>
        </div>
        <button class="btn bg-red-500 text-white">Blog</button>
      </nav>
    </header>

    <!-- Main -->
    <main>
      <!-- Navigation buttons -->
      <!-- dainamically Adding button from API -->
      <div
        class="mt-12 w-10/12 mx-auto flex gap-9 justify-center"
        id="categatory-container"
      >
        <button
          class="btn hover:bg-red-500 hover:text-white"
          onclick="loadVedioes()"
        >
          All
        </button>
      </div>

      <!-- Content Container -->
      <div class="w-11/12 mx-auto mt-16">
        <div id="NoContent" class="text-center">
          <img src="./Icon.png" alt="" class="mx-auto" />
          <h1 class="text-4xl font-semibold">
            Opps Sorry !! There is no vedio here
          </h1>
        </div>

        <div
          id="Vedio-Container"
          class="grid grid-cols-1 md:grid-cols-4 gap-5"
        ></div>
      </div>

      <!-- Modal -->
      <div>
        <!-- Open the modal using ID.showModal() method -->
        <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
        <dialog id="vedioDetails" class="modal">
          <div class="modal-box">
            <div id="detailsContainer">

            </div>
            <div class="modal-action">
              <form method="dialog">
                <!-- if there is a button in form, it will close the modal -->
                <button class="btn">Close</button>
              </form>
            </div>
          </div>
        </dialog>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
